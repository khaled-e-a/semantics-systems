name: Weekly VV/UQ/Evals Paper Digest

on:
  schedule:
    # 05:00 UTC Monday = 12:00 AM Monday Eastern Time (standard time).
    # GitHub Actions cron has no DST awareness, so this drifts to 1:00 AM ET
    # during EDT (summer) — accepted, doesn't affect the "ready by Monday
    # morning" goal.
    - cron: '0 5 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

defaults:
  run:
    working-directory: vv-paper-fetcher

jobs:
  run-digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: vv-paper-fetcher/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run weekly digest
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ secrets.OPENROUTER_MODEL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          REPORT_EMAIL_TO: ${{ secrets.REPORT_EMAIL_TO }}
          REPORT_EMAIL_FROM: ${{ secrets.REPORT_EMAIL_FROM }}
          SEMANTIC_SCHOLAR_API_KEY: ${{ secrets.SEMANTIC_SCHOLAR_API_KEY }}
        run: python main.py --verbose

      - name: Commit report and state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports state
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: weekly paper digest ($(date -u +%Y-%m-%d))"
          git push
