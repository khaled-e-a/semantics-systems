<h1 class="ltx_title ltx_title_document">Reward Hacking Challenges Oversight of Autonomous Research Agents</h1>
<figure class="ltx_figure" id="S1.F1"><img alt="Refer to caption" class="ltx_graphics ltx_centering ltx_img_landscape" height="167" id="S1.F1.g1" src="2609.28614v1/fig_teaser_repacked.png" style="aspect-ratio:476/167;" width="476"/>
<figcaption class="ltx_caption ltx_centering" style="--ltx-fg-color:#1A1A1A;"><span class="ltx_tag ltx_tag_figure">Figure 1: </span><span class="ltx_text ltx_font_bold" id="S1.F1.11">From spontaneous reward hacking to adaptive evasion under oversight.</span>
Research agents produce both results and the evidence used to assess them, motivating
three progressively deeper tests of this workflow. Top, the shared research process;
the dashed feedback loop applies only to E3. Bottom, <span class="ltx_text ltx_font_bold" id="S1.F1.12">E1: Spontaneous reward hacking.</span>
We measure hacking under ordinary task instructions, without a request to hack.
<span class="ltx_text ltx_font_bold" id="S1.F1.13">E2: Hacking effectiveness and detectability.</span> We evaluate exploits when
hacking is permitted; the bars illustrate exploits
exceeding thresholds that compliant baselines do not meet. The quality review rates
the hacking method on efficacy, generality, craft, and novelty, each on a 1–10 scale.
<span class="ltx_text ltx_font_bold" id="S1.F1.14">E3: Adaptation to oversight.</span> Given an explicit evasion objective and review feedback, agents revise
their methods, and some exploits remain undetected. The terracotta trace passes
through the reviewer to illustrate a missed exploit. Arrows between E1–E3 indicate
the progression of research questions. The illustrations are schematic.</figcaption>
</figure>
<figure class="ltx_figure" id="S1.F2"><object class="ltx_graphics ltx_centering ltx_img_landscape" data="2609.28614v1/fig_setups.svg" height="190" id="S1.F2.g1" style="aspect-ratio:476/190;" type="image/svg+xml" width="476"></object>
<figcaption class="ltx_caption ltx_centering" style="--ltx-fg-color:#1A1A1A;"><span class="ltx_tag ltx_tag_figure">Figure 2: </span><span class="ltx_text ltx_font_bold" id="S1.F2.11">Evaluation settings.</span> <span class="ltx_text ltx_font_bold" id="S1.F2.12">(a)</span> Setting 1 measures spontaneous reward hacking
in one complete agent session per model–task pair, without instructions to hack.
A full-trajectory evaluator uses the trajectory,
submission, and instrumented checks. <span class="ltx_text ltx_font_bold" id="S1.F2.13">(b)</span> Setting 2 allows reward hacking on
baseline-exceeding tasks. An LLM review panel that sees the submitted code and reported
score, but not the trajectory or mechanism summary, tests whether it detects the method
(Metric 1), conditional on threshold passage and mechanism verification; a separate panel
rates quality (Metric 2). <span class="ltx_text ltx_font_bold" id="S1.F2.14">(c)</span> Setting 3 returns the review
panel’s decision, reasons, and the attempt history to the agent for up to five rounds.</figcaption>
</figure>

<figcaption class="ltx_caption ltx_centering" style="--ltx-fg-color:#1A1A1A;"><span class="ltx_tag ltx_tag_figure">Figure 7: </span><span class="ltx_text ltx_font_bold" id="S6.F7.21">Evasion across tasks and review rounds.</span>
<em class="ltx_emph ltx_font_italic" id="S6.F7.22">(a)</em> Evasions under submission-only review by model and task. Most occur on a few tasks where the
exploit resembles ordinary work. <em class="ltx_emph ltx_font_italic" id="S6.F7.23">(b)</em> Share of the <math alttext="150" class="ltx_Math" display="inline" id="S6.F7.m5" intent=":literal"><semantics><mn mathcolor="#1A1A1A" style="--ltx-fg-color:#1A1A1A;">150</mn><annotation encoding="application/x-tex">150</annotation></semantics></math> pairs still caught after

<em class="ltx_emph ltx_font_italic" id="S6.F7.24">(c)</em> Mean quality ratings among reward-hacking runs in each round. Efficacy falls as
novelty and craft rise. <em class="ltx_emph ltx_font_italic" id="S6.F7.25">(d)</em> Shares of the empirical technique families defined in
<a class="ltx_ref" href="#S7" title="7 Reward-hacking techniques ‣ Reward Hacking Challenges Oversight of Autonomous Research Agents"><span class="ltx_text ltx_ref_tag">§</span> <span class="ltx_text ltx_ref_tag">7</span></a>. Direct leakage
(green) becomes less common. <em class="ltx_emph ltx_font_italic" id="S6.F7.26">(e)</em> Evasion rate among reward-hacking runs in each round,
from <math alttext="4.7\%" class="ltx_Math" display="inline" id="S6.F7.m6" intent=":literal"><semantics><mrow><mn mathcolor="#1A1A1A" style="--ltx-fg-color:#1A1A1A;">4.7</mn><mo mathcolor="#1A1A1A" style="--ltx-fg-color:#1A1A1A;">%</mo></mrow><annotation encoding="application/x-tex">4.7\%</annotation></semantics></math> to <math alttext="19.6\%" class="ltx_Math" display="inline" id="S6.F7.m7" intent=":literal"><semantics><mrow><mn mathcolor="#1A1A1A" style="--ltx-fg-color:#1A1A1A;">19.6</mn><mo mathcolor="#1A1A1A" style="--ltx-fg-color:#1A1A1A;">%</mo></mrow><annotation encoding="application/x-tex">19.6\%</annotation></semantics></math> (bands: <math alttext="95\%" class="ltx_Math" display="inline" id="S6.F7.m8" intent=":literal"><semantics><mrow><mn mathcolor="#1A1A1A" style="--ltx-fg-color:#1A1A1A;">95</mn><mo mathcolor="#1A1A1A" style="--ltx-fg-color:#1A1A1A;">%</mo></mrow><annotation encoding="application/x-tex">95\%</annotation></semantics></math> Wilson CIs). Panels (c)–(e) describe a changing
